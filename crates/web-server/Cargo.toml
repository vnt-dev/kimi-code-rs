[package]
name = "kimi-code-web-server"
version = "0.1.0"
edition = "2024"
description = "Embedded HTTP and WebSocket bridge for Kimi Code graphical clients"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
kimi-code-agent-core-v2 = { path = "../agent-core-v2" }
kimi-code-fs = { path = "../fs" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
# Server tests run outside the desktop bootstrap and need a built-in provider.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
tokio-tungstenite = "0.29"
