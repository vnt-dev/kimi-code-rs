[package]
name = "kimi-code-agent-core-v2"
version = "0.1.2"
edition = "2024"
description = "Kimi Code agent core model and provider abstractions"
publish = false

[dependencies]
async-trait = "0.1.91"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
globset = { version = "0.4.19", default-features = false }
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.48.5", default-features = false }
kimi-code-protocol = { path = "../protocol" }
kimi-code-minidb = { path = "../minidb" }
kimi-code-oauth = { path = "../oauth" }
libc = "0.2"
notify = "8.2.0"
percent-encoding = "2"
portable-pty = "0.9.0"
regex = "1"
regress = { version = "0.11.1", default-features = false, features = ["std", "utf16"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = { version = "1.1.3", features = ["preserve_order"] }
url = { version = "2", features = ["serde"] }
unicode-segmentation = "1.12"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
yaml-rust = "0.4.5"
zip = { version = "8.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
uzers = { version = "0.12.2", default-features = false }
