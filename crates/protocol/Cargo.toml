[package]
name = "kimi-code-protocol"
version = "0.1.0"
edition = "2024"
description = "Kimi Code protocol data types and wire-format definitions"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_repr = "0.1"
ulid = "1"
url = "2"
