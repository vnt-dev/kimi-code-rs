[package]
name = "kimi-code-kap-server"
version = "0.1.0"
edition = "2024"
description = "Kimi Code server backed by the DI × Scope agent engine (agent-core-v2)"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
kimi-code-protocol = { path = "../protocol" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
toml = { version = "1.1.0", features = ["preserve_order"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
