[package]
name = "kimi-code-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
async-trait = "0.1.91"
atomic-write-file = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
if-addrs = "0.15"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "sync", "test-util", "time"] }
toml = "1.1.3"
url = "2"
