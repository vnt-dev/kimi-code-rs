[package]
name = "kimi-code-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "kimi"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
atomic-write-file = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
futures-util = "0.3"
if-addrs = "0.15"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.11"
pulldown-cmark = "0.13.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1.3"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-default-fancy"] }
url = "2"
unicode-width = "0.2"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4"] }
ulid = "1"
zip = { version = "8.6.0", default-features = false, features = ["chrono", "deflate"] }
