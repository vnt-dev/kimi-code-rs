[package]
name = "kimi-code-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
async-trait = "0.1.91"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
if-addrs = "0.15"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "test-util", "time"] }
url = "2"
